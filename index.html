<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chabakaew Cyber Desktop</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            height: 100vh;
            overflow: hidden;
            background: #0d0814;
            color: #fff;
        }

        /* Desktop Area */
        #desktop {
            position: relative;
            width: 100vw;
            height: calc(100vh - 50px);
            background-size: cover;
            background-position: center;
            padding: 20px;
            transition: background-image 0.5s ease;
        }

        /* App Shortcuts Grid (3 Rows) */
        .icon-grid {
            display: grid;
            grid-template-rows: repeat(3, 95px);
            grid-auto-flow: column;
            gap: 15px 10px;
            width: max-content;
        }

        .shortcut {
            width: 85px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            padding: 8px;
            border-radius: 12px;
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.2s;
        }

        /* Bounce Animation */
        .shortcut:hover {
            background: rgba(255, 105, 180, 0.2);
            backdrop-filter: blur(8px);
            transform: scale(1.15) translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .shortcut:active {
            transform: scale(0.9) translateY(2px);
        }

        .shortcut img {
            width: 45px;
            height: 45px;
            margin-bottom: 6px;
            filter: drop-shadow(0 0 6px rgba(255, 105, 180, 0.5));
            object-fit: contain;
        }

        .shortcut span {
            font-size: 11px;
            color: #ffffff;
            text-shadow: 0 0 4px #000, 0 0 2px #000;
            word-break: break-word;
            line-height: 1.2;
        }

        /* Animated Chabakaew Robot */
        .robot-container {
            position: absolute;
            right: 60px;
            bottom: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: float 3.5s ease-in-out infinite;
            pointer-events: none;
        }

        .flower-head {
            position: absolute;
            top: -12px;
            right: 10px;
            font-size: 24px;
            z-index: 2;
            filter: drop-shadow(0 0 5px #ff69b4);
        }

        .robot-avatar {
            width: 110px;
            height: 110px;
            background: radial-gradient(circle, #ffb6c1 0%, #ff1493 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 30px rgba(255, 20, 147, 0.8), inset 0 0 15px #fff;
            border: 3px solid #fff;
            position: relative;
        }

        .robot-eyes {
            display: flex;
            gap: 16px;
        }

        .eye {
            width: 16px;
            height: 22px;
            background: #111;
            border-radius: 50%;
            position: relative;
            animation: blink 4s infinite;
        }

        .eye::after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 6px;
            height: 6px;
            background: #00ffff;
            border-radius: 50%;
            box-shadow: 0 0 5px #00ffff;
        }

        .robot-nametag {
            margin-top: 10px;
            background: rgba(20, 10, 25, 0.85);
            border: 1px solid #ff69b4;
            padding: 4px 14px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            color: #ffb6c1;
            box-shadow: 0 0 12px rgba(255, 105, 180, 0.5);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        @keyframes blink {
            0%, 90%, 100% { transform: scaleY(1); }
            95% { transform: scaleY(0.1); }
        }

        /* Bottom Taskbar */
        #taskbar {
            height: 50px;
            background: rgba(12, 8, 18, 0.85);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 105, 180, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            position: fixed;
            bottom: 0;
            width: 100%;
            z-index: 100;
        }

        .taskbar-left {
            display: flex;
            align-items: center;
            width: 200px;
        }

        .start-btn {
            width: 36px;
            height: 36px;
            background: radial-gradient(circle, #ff69b4, #ff1493);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(255, 105, 180, 0.6);
            border: 1px solid #fff;
            transition: transform 0.2s;
        }

        .start-btn:hover {
            transform: scale(1.1);
        }

        /* Centered Search Bar */
        .taskbar-center {
            flex: 1;
            display: flex;
            justify-content: center;
        }

        .search-bar {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 105, 180, 0.4);
            border-radius: 20px;
            padding: 6px 16px;
            width: 100%;
            max-width: 400px;
            transition: 0.3s;
        }

        .search-bar:focus-within {
            border-color: #ff69b4;
            box-shadow: 0 0 15px rgba(255, 105, 180, 0.5);
            background: rgba(0, 0, 0, 0.6);
        }

        .search-bar input {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            padding-left: 10px;
            width: 100%;
            font-size: 13px;
        }

        /* Right System Tray (Wifi, Battery, Clock) */
        .system-tray {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 16px;
            font-size: 12px;
            color: #ffb6c1;
            width: 250px;
        }

        .tray-icon {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        #clock {
            color: #fff;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(255, 105, 180, 0.8);
        }
    </style>
</head>
<body>

    <div id="desktop">
        
        <div class="icon-grid">
            <div class="shortcut" onclick="openLink('https://facebook.com')">
                <img src="https://cdn-icons-png.flaticon.com/512/5968/5968764.png" alt="FB">
                <span>Facebook</span>
            </div>
            <div class="shortcut" onclick="openLink('https://instagram.com')">
                <img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png" alt="IG">
                <span>Instagram</span>
            </div>
            <div class="shortcut" onclick="openLink('https://web.whatsapp.com')">
                <img src="https://cdn-icons-png.flaticon.com/512/3670/3670051.png" alt="WhatsApp">
                <span>WhatsApp</span>
            </div>
            <div class="shortcut" onclick="openLink('https://weibo.com')">
                <img src="https://cdn-icons-png.flaticon.com/512/3670/3670081.png" alt="Weibo">
                <span>Weibo</span>
            </div>
            <div class="shortcut" onclick="openLink('https://discord.com')">
                <img src="https://cdn-icons-png.flaticon.com/512/5968/5968756.png" alt="Discord">
                <span>Discord</span>
            </div>
            <div class="shortcut" onclick="openLink('https://drive.google.com')">
                <img src="https://cdn-icons-png.flaticon.com/512/5968/5968523.png" alt="Drive">
                <span>Drive</span>
            </div>
            <div class="shortcut" onclick="openLink('https://youtube.com')">
                <img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png" alt="YT">
                <span>YouTube</span>
            </div>
            <div class="shortcut" onclick="openLink('https://classroom.google.com')">
                <img src="https://cdn-icons-png.flaticon.com/512/2991/2991108.png" alt="Classroom">
                <span>Classroom</span>
            </div>
            <div class="shortcut" onclick="openLink('https://docs.google.com')">
                <img src="https://cdn-icons-png.flaticon.com/512/2991/2991106.png" alt="docs">
                <span>cods</span>
            </div>
            <div class="shortcut" onclick="openLink('https://sheets.google.com')">
                <img src="https://cdn-icons-png.flaticon.com/512/2991/2991108.png" alt="sheet">
                <span>sheet</span>
            </div>
            <div class="shortcut" onclick="openLink('https://slides.google.com')">
                <img src="https://cdn-icons-png.flaticon.com/512/2991/2991110.png" alt="slides">
                <span>สไลด์</span>
            </div>
            <div class="shortcut" onclick="openLink('https://keep.google.com')">
                <img src="https://cdn-icons-png.flaticon.com/512/2991/2991120.png" alt="keep">
                <span>keep</span>
            </div>
            <div class="shortcut" onclick="openLink('https://forms.google.com')">
                <img src="https://cdn-icons-png.flaticon.com/512/2991/2991112.png" alt="forms">
                <span>forms</span>
            </div>
            <div class="shortcut" onclick="openLink('https://www.e-tech.ac.th')">
                <img src="https://cdn-icons-png.flaticon.com/512/1085/1085493.png" alt="e-tech">
                <span>e-tech</span>
            </div>
            <div class="shortcut" onclick="openLink('https://mea.or.th')">
                <img src="https://cdn-icons-png.flaticon.com/512/3109/3109813.png" alt="Electricity">
                <span>บันทึกค่าไฟฟ้า</span>
            </div>
            <div class="shortcut" onclick="openLink('https://docs.google.com/spreadsheets')">
                <img src="https://cdn-icons-png.flaticon.com/512/2362/2362321.png" alt="Expenses">
                <span>สรุปค่าใช้จ่าย</span>
            </div>
            <div class="shortcut" onclick="openLink('https://docs.google.com/spreadsheets')">
                <img src="https://cdn-icons-png.flaticon.com/512/3596/3596091.png" alt="Total">
                <span>สรุปยอดทั้งหมด</span>
            </div>
            <div class="shortcut" onclick="openLink('https://chat.google.com')">
                <img src="https://cdn-icons-png.flaticon.com/512/2991/2991141.png" alt="Google Chat">
                <span>googlechat</span>
            </div>
        </div>

        <div class="robot-container">
            <div class="flower-head">🌺</div>
            <div class="robot-avatar">
                <div class="robot-eyes">
                    <div class="eye"></div>
                    <div class="eye"></div>
                </div>
            </div>
            <div class="robot-nametag">น้องชบาแก้ว AI</div>
        </div>

    </div>

    <div id="taskbar">
        <div class="taskbar-left">
            <div class="start-btn" onclick="alert('สวัสดีค่ะ! น้องชบาแก้วพร้อมระบบพร้อมทำงานค่ะ')">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M0 0h11v11H0zM13 0h11v11H13zM0 13h11v11H0zM13 13h11v11H13z"/></svg>
            </div>
        </div>

        <div class="taskbar-center">
            <div class="search-bar">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#ff69b4" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
                <input type="text" id="searchInput" placeholder="พิมพ์เพื่อค้นหา Google..." onkeypress="handleSearch(event)">
            </div>
        </div>

        <div class="system-tray">
            <div class="tray-icon" title="สถานะอินเทอร์เน็ต">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="#ffb6c1"><path d="M12 3c-4.97 0-9.4 2.06-12.55 5.37l2.12 2.12c2.67-2.8 6.42-4.54 10.43-4.54 4.01 0 7.76 1.74 10.43 4.54l2.12-2.12c-3.15-3.31-7.58-5.37-12.55-5.37zm0 6c-3.31 0-6.27 1.38-8.36 3.6l2.12 2.12c1.6-1.7 3.82-2.77 6.24-2.77s4.64 1.07 6.24 2.77l2.12-2.12c-2.09-2.22-5.05-3.6-8.36-3.6zm0 6c-1.66 0-3.14.69-4.22 1.78l4.22 4.22 4.22-4.22c-1.08-1.09-2.56-1.78-4.22-1.78z"/></svg>
                <span id="wifi-status">Online</span>
            </div>

            <div class="tray-icon" title="แบตเตอรี่">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="#ffb6c1"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
                <span id="battery-level">100%</span>
            </div>

            <span id="clock">00:00:00</span>
        </div>
    </div>

    <script>
        // -----------------------------------------------------------
        // CONFIG : วิธีเปลี่ยนภาพพื้นหลังในโค้ด
        // -----------------------------------------------------------
        const DEFAULT_BG_URL = 'https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1920&q=80';

        function initDesktop() {
            const desktop = document.getElementById('desktop');
            desktop.style.backgroundImage = `radial-gradient(circle, rgba(255, 105, 180, 0.15) 0%, rgba(13, 8, 20, 0.75) 100%), url('${DEFAULT_BG_URL}')`;
        }

        // ค้นหาผ่าน Google
        function handleSearch(event) {
            if (event.key === 'Enter') {
                const query = document.getElementById('searchInput').value;
                if (query) {
                    window.open(`https://www.google.com/search?q=${encodeURIComponent(query)}`, '_blank');
                }
            }
        }

        // เปิดลิงก์เว็บไซต์
        function openLink(url) {
            window.open(url, '_blank');
        }

        // นาฬิกาเรียลไทม์
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('th-TH');
        }

        // ดึงข้อมูลเปอร์เซ็นต์แบตเตอรี่จริง
        function initBattery() {
            if (navigator.getBattery) {
                navigator.getBattery().then(battery => {
                    const updateBattery = () => {
                        document.getElementById('battery-level').innerText = `${Math.round(battery.level * 100)}%`;
                    };
                    updateBattery();
                    battery.addEventListener('levelchange', updateBattery);
                });
            } else {
                document.getElementById('battery-level').innerText = "100%";
            }
        }

        // ตรวจสอบสถานะอินเทอร์เน็ต
        function updateOnlineStatus() {
            const status = document.getElementById('wifi-status');
            status.innerText = navigator.onLine ? "Online" : "Offline";
        }

        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);

        // เริ่มต้นการทำงาน
        initDesktop();
        initBattery();
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
