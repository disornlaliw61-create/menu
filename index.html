<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chabakaew Cyber Desktop</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            height: 100vh;
            overflow: hidden;
            background: #0d0814;
            color: #fff;
        }

        /* Desktop Workspace */
        #desktop {
            position: relative;
            width: 100vw;
            height: calc(100vh - 45px);
            background-image: radial-gradient(circle, rgba(255, 105, 180, 0.15) 0%, rgba(13, 8, 20, 0.85) 100%), 
                              url('https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            transition: background-image 0.4s ease-in-out;
            padding: 20px;
        }

        /* App Shortcuts Grid */
        .icon-grid {
            display: grid;
            grid-template-rows: repeat(auto-fill, 90px);
            grid-auto-flow: column;
            gap: 15px;
            width: max-content;
        }

        .shortcut {
            width: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid transparent;
            transition: all 0.2s;
        }

        .shortcut:hover {
            background: rgba(255, 105, 180, 0.2);
            border: 1px solid rgba(255, 182, 193, 0.6);
            box-shadow: 0 0 15px rgba(255, 105, 180, 0.4);
            backdrop-filter: blur(5px);
        }

        .shortcut img {
            width: 42px;
            height: 42px;
            margin-bottom: 5px;
            filter: drop-shadow(0 0 5px rgba(255, 105, 180, 0.6));
        }

        .shortcut span {
            font-size: 11px;
            color: #ffe4e1;
            text-shadow: 0 0 4px #000;
            word-break: break-word;
        }

        /* Robot Chabakaew Widget */
        .robot-container {
            position: absolute;
            right: 60px;
            bottom: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: float 3.5s ease-in-out infinite;
            pointer-events: none;
        }

        .flower-head {
            position: absolute;
            top: -12px;
            right: 10px;
            font-size: 24px;
            z-index: 2;
            filter: drop-shadow(0 0 5px #ff69b4);
        }

        .robot-avatar {
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, #ffb6c1 0%, #ff1493 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 30px rgba(255, 20, 147, 0.8), inset 0 0 15px #fff;
            border: 3px solid #fff;
            position: relative;
        }

        .robot-eyes {
            display: flex;
            gap: 18px;
        }

        .eye {
            width: 18px;
            height: 24px;
            background: #111;
            border-radius: 50%;
            position: relative;
            animation: blink 4s infinite;
        }

        .eye::after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 7px;
            height: 7px;
            background: #00ffff;
            border-radius: 50%;
            box-shadow: 0 0 5px #00ffff;
        }

        .robot-nametag {
            margin-top: 12px;
            background: rgba(20, 10, 25, 0.85);
            border: 1px solid #ff69b4;
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 13px;
            font-weight: bold;
            color: #ffb6c1;
            letter-spacing: 1px;
            box-shadow: 0 0 12px rgba(255, 105, 180, 0.5);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(3deg); }
        }

        @keyframes blink {
            0%, 90%, 100% { transform: scaleY(1); }
            95% { transform: scaleY(0.1); }
        }

        /* Google BG Control Box */
        .bg-changer-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(20, 10, 25, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 105, 180, 0.4);
            padding: 12px 16px;
            border-radius: 12px;
            display: flex;
            gap: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.6);
        }

        .bg-changer-panel input {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #ff69b4;
            color: #fff;
            padding: 8px 12px;
            border-radius: 6px;
            outline: none;
            width: 260px;
            font-size: 12px;
        }

        .bg-changer-panel button {
            background: linear-gradient(45deg, #ff69b4, #ff1493);
            border: none;
            color: #fff;
            font-weight: bold;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 12px;
            box-shadow: 0 0 10px rgba(255, 20, 147, 0.4);
        }

        .bg-changer-panel button:hover {
            box-shadow: 0 0 15px #ff69b4;
            transform: scale(1.02);
        }

        /* Taskbar Bottom */
        #taskbar {
            height: 45px;
            background: rgba(12, 8, 18, 0.9);
            backdrop-filter: blur(15px);
            border-top: 1px solid rgba(255, 105, 180, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            position: fixed;
            bottom: 0;
            width: 100%;
            z-index: 100;
        }

        .taskbar-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .start-btn {
            width: 32px;
            height: 32px;
            background: radial-gradient(circle, #ff69b4, #ff1493);
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(255, 105, 180, 0.6);
            border: 1px solid #fff;
        }

        .search-bar {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 105, 180, 0.4);
            border-radius: 20px;
            padding: 4px 12px;
            transition: 0.3s;
        }

        .search-bar:focus-within {
            border-color: #ff69b4;
            box-shadow: 0 0 12px rgba(255, 105, 180, 0.5);
            background: rgba(0, 0, 0, 0.5);
        }

        .search-bar input {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            padding-left: 8px;
            width: 220px;
            font-size: 13px;
        }

        .system-tray {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 12px;
            color: #ffb6c1;
        }

        #clock {
            color: #fff;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(255, 105, 180, 0.8);
        }
    </style>
</head>
<body>

    <div id="desktop">
        
        <div class="icon-grid">
            <div class="shortcut" onclick="openLink('https://facebook.com')">
                <img src="https://cdn-icons-png.flaticon.com/512/5968/5968764.png" alt="FB">
                <span>Facebook</span>
            </div>
            <div class="shortcut" onclick="openLink('https://instagram.com')">
                <img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png" alt="IG">
                <span>Instagram</span>
            </div>
            <div class="shortcut" onclick="openLink('https://youtube.com')">
                <img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png" alt="YT">
                <span>YouTube</span>
            </div>
            <div class="shortcut" onclick="openLink('https://drive.google.com')">
                <img src="https://cdn-icons-png.flaticon.com/512/5968/5968523.png" alt="Drive">
                <span>Drive</span>
            </div>
            <div class="shortcut" onclick="openLink('https://discord.com')">
                <img src="https://cdn-icons-png.flaticon.com/512/5968/5968756.png" alt="Discord">
                <span>Discord</span>
            </div>
        </div>

        <div class="bg-changer-panel">
            <input type="text" id="bgUrlInput" placeholder="วางลิงก์รูปภาพจาก Google ที่นี่...">
            <button onclick="changeBackground()">เปลี่ยนรูปพื้นหลัง</button>
        </div>

        <div class="robot-container">
            <div class="flower-head">🌺</div>
            <div class="robot-avatar">
                <div class="robot-eyes">
                    <div class="eye"></div>
                    <div class="eye"></div>
                </div>
            </div>
            <div class="robot-nametag">น้องชบาแก้ว AI</div>
        </div>

    </div>

    <div id="taskbar">
        <div class="taskbar-left">
            <div class="start-btn" onclick="alert('สวัสดีค่ะ! น้องชบาแก้วพร้อมช่วยเหลือค่ะ')">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M0 0h11v11H0zM13 0h11v11H13zM0 13h11v11H0zM13 13h11v11H13z"/></svg>
            </div>
            <div class="search-bar">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#ff69b4" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
                <input type="text" id="searchInput" placeholder="พิมพ์เพื่อค้นหา Google..." onkeypress="handleSearch(event)">
            </div>
        </div>

        <div class="system-tray">
            <span>ONLINE</span>
            <span id="clock">00:00:00</span>
        </div>
    </div>

    <script>
        // ฟังก์ชันเปลี่ยนพื้นหลัง รองรับ URL จาก Google Images แบบสกัดลิงก์อัตโนมัติ
        function changeBackground() {
            let url = document.getElementById('bgUrlInput').value.trim();

            if (!url) {
                alert('กรุณาใส่ URL ของรูปภาพก่อนครับ');
                return;
            }

            // สกัดURL กรณีผู้ใช้วางลิงก์หน้าค้นหา Google Images (imgurl=...)
            if (url.includes('imgurl=')) {
                const matches = url.match(/imgurl=([^&]+)/);
                if (matches && matches[1]) {
                    url = decodeURIComponent(matches[1]);
                }
            }

            // เปลี่ยนรูปภาพพื้นหลัง
            const desktop = document.getElementById('desktop');
            desktop.style.backgroundImage = `radial-gradient(circle, rgba(255, 105, 180, 0.15) 0%, rgba(13, 8, 20, 0.7) 100%), url('${url}')`;
        }

        // ค้นหาบน Google เมื่อกด Enter
        function handleSearch(event) {
            if (event.key === 'Enter') {
                const query = document.getElementById('searchInput').value;
                if (query) {
                    window.open(`https://www.google.com/search?q=${encodeURIComponent(query)}`, '_blank');
                }
            }
        }

        // เปิดลิงก์
        function openLink(url) {
            window.open(url, '_blank');
        }

        // นาฬิกา Real-time
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('th-TH');
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
