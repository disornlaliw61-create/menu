<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chabakaew Cyber Desktop</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            height: 100vh;
            overflow: hidden;
            background: #0d0814;
            color: #fff;
        }

        /* Desktop Area */
        #desktop {
            position: relative;
            width: 100vw;
            height: calc(100vh - 50px);
            background-size: cover;
            background-position: center;
            padding: 20px;
            transition: background-image 0.5s ease;
        }

        /* App Shortcuts Grid (3 Rows) */
        .icon-grid {
            display: grid;
            grid-template-rows: repeat(3, 95px);
            grid-auto-flow: column;
            gap: 15px 10px;
            width: max-content;
        }

        .shortcut {
            width: 85px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            padding: 8px;
            border-radius: 12px;
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.2s;
        }

        /* Bounce Animation */
        .shortcut:hover {
            background: rgba(255, 105, 180, 0.2);
            backdrop-filter: blur(8px);
            transform: scale(1.15) translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .shortcut:active {
            transform: scale(0.9) translateY(2px);
        }

        .shortcut img {
            width: 45px;
            height: 45px;
            margin-bottom: 6px;
            filter: drop-shadow(0 0 6px rgba(255, 105, 180, 0.5));
            object-fit: contain;
        }

        .shortcut span {
            font-size: 11px;
            color: #ffffff;
            text-shadow: 0 0 4px #000, 0 0 2px #000;
            word-break: break-word;
            line-height: 1.2;
        }

        /* Animated Chabakaew Robot */
        .robot-container {
            position: absolute;
            right: 60px;
            bottom: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: float 3.5s ease-in-out infinite;
            pointer-events: none;
        }

        .flower-head {
            position: absolute;
            top: -12px;
            right: 10px;
            font-size: 24px;
            z-index: 2;
            filter: drop-shadow(0 0 5px #ff69b4);
        }

        .robot-avatar {
            width: 110px;
            height: 110px;
            background: radial-gradient(circle, #ffb6c1 0%, #ff1493 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 30px rgba(255, 20, 147, 0.8), inset 0 0 15px #fff;
            border: 3px solid #fff;
            position: relative;
        }

        .robot-eyes {
            display: flex;
            gap: 16px;
        }

        .eye {
            width: 16px;
            height: 22px;
            background: #111;
            border-radius: 50%;
            position: relative;
            animation: blink 4s infinite;
        }

        .eye::after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 6px;
            height: 6px;
            background: #00ffff;
            border-radius: 50%;
            box-shadow: 0 0 5px #00ffff;
        }

        .robot-nametag {
            margin-top: 10px;
            background: rgba(20, 10, 25, 0.85);
            border: 1px solid #ff69b4;
            padding: 4px 14px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            color: #ffb6c1;
            box-shadow: 0 0 12px rgba(255, 105, 180, 0.5);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        @keyframes blink {
            0%, 90%, 100% { transform: scaleY(1); }
            95% { transform: scaleY(0.1); }
        }

        /* Bottom Taskbar */
        #taskbar {
            height: 50px;
            background: rgba(12, 8, 18, 0.85);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 105, 180, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            position: fixed;
            bottom: 0;
            width: 100%;
            z-index: 100;
        }

        .taskbar-left {
            display: flex;
            align-items: center;
            width: 200px;
        }

        .start-btn {
            width: 36px;
            height: 36px;
            background: radial-gradient(circle, #ff69b4, #ff1493);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(255, 105, 180, 0.6);
            border: 1px solid #fff;
            transition: transform 0.2s;
        }

        .start-btn:hover {
            transform: scale(1.1);
        }

        /* Centered Search Bar */
        .taskbar-center {
            flex: 1;
            display: flex;
            justify-content: center;
        }

        .search-bar {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 105, 180, 0.4);
            border-radius: 20px;
            padding: 6px 16px;
            width: 100%;
            max-width: 400px;
            transition: 0.3s;
        }

        .search-bar:focus-within {
            border-color: #ff69b4;
            box-shadow: 0 0 15px rgba(255, 105, 180, 0.5);
            background: rgba(0, 0, 0, 0.6);
        }

        .search-bar input {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            padding-left: 10px;
            width: 100%;
            font-size: 13px;
        }

        /* Right System Tray (Wifi, Battery, Clock) */
        .system-tray {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 16px;
            font-size: 12px;
            color: #ffb6c1;
            width: 250px;
        }

        .tray-icon {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        #clock {
            color: #fff;
            font-weight: bold;
            text-shadow: 0 0 8px rgba(255, 105, 180, 0.8);
        }
    </style>
</head>

        // -----------------------------------------------------------

        const DEFAULT_BG_URL = 'https://lh3.googleusercontent.com/nv5YwL5ntCYtHuUKnsQY-xi6KyGua1zFH6oJmFtn4CryRyqAiwdulGPTf5YNOfNh4cbBRMJXoGhSwrhb=w1686';

        function initDesktop() {
            const desktop = document.getElementById('desktop');
            desktop.style.backgroundImage = `radial-gradient(circle, rgba(255, 105, 180, 0.15) 0%, rgba(13, 8, 20, 0.75) 100%), url('${DEFAULT_BG_URL}')`;
        }

        // ค้นหาผ่าน Google
        function handleSearch(event) {
            if (event.key === 'Enter') {
                const query = document.getElementById('searchInput').value;
                if (query) {
                    window.open(`https://www.google.com/search?q=${encodeURIComponent(query)}`, '_blank');
                }
            }
        }

        // เปิดลิงก์เว็บไซต์
        function openLink(url) {
            window.open(url, '_blank');
        }

        // นาฬิกาเรียลไทม์
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('th-TH');
        }

        // ดึงข้อมูลเปอร์เซ็นต์แบตเตอรี่จริง
        function initBattery() {
            if (navigator.getBattery) {
                navigator.getBattery().then(battery => {
                    const updateBattery = () => {
                        document.getElementById('battery-level').innerText = `${Math.round(battery.level * 100)}%`;
                    };
                    updateBattery();
                    battery.addEventListener('levelchange', updateBattery);
                });
            } else {
                document.getElementById('battery-level').innerText = "100%";
            }
        }

        // ตรวจสอบสถานะอินเทอร์เน็ต
        function updateOnlineStatus() {
            const status = document.getElementById('wifi-status');
            status.innerText = navigator.onLine ? "Online" : "Offline";
        }

        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);

        // เริ่มต้นการทำงาน
        initDesktop();
        initBattery();
        setInterval(updateClock, 1000);
        updateClock();
    </script>
