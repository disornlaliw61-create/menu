<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futuristic Cyber Desktop</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            height: 100vh;
            overflow: hidden;
            background: #080c14;
            color: #fff;
        }

        /* Background Display */
        #desktop {
            position: relative;
            width: 100vw;
            height: calc(100vh - 45px);
            background-image: radial-gradient(circle, rgba(16,33,62,0.8) 0%, rgba(7,11,20,0.95) 100%), 
                              url('https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            transition: background-image 0.5s ease-in-out;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Grid Shortcuts */
        .icon-grid {
            display: grid;
            grid-template-rows: repeat(auto-fill, 90px);
            grid-auto-flow: column;
            gap: 15px;
            width: max-content;
        }

        .shortcut {
            width: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid transparent;
            transition: all 0.2s;
        }

        .shortcut:hover {
            background: rgba(0, 242, 254, 0.15);
            border: 1px solid rgba(0, 242, 254, 0.5);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
            backdrop-filter: blur(5px);
        }

        .shortcut img {
            width: 42px;
            height: 42px;
            margin-bottom: 5px;
            filter: drop-shadow(0 0 5px rgba(0,242,254,0.5));
        }

        .shortcut span {
            font-size: 11px;
            color: #e0f7fa;
            text-shadow: 0 0 4px #000;
            word-break: break-word;
        }

        /* Floating Robot Animation */
        .robot-container {
            position: absolute;
            right: 50px;
            bottom: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: float 4s ease-in-out infinite;
            pointer-events: none;
        }

        .robot-avatar {
            width: 110px;
            height: 110px;
            background: radial-gradient(circle, #00f2fe 0%, #4facfe 100%);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 25px #00f2fe, inset 0 0 15px #fff;
            border: 2px solid #fff;
            position: relative;
        }

        .robot-eyes {
            display: flex;
            gap: 15px;
        }

        .eye {
            width: 16px;
            height: 22px;
            background: #080c14;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
        }

        .eye::after {
            content: '';
            position: absolute;
            top: 3px;
            left: 3px;
            width: 6px;
            height: 6px;
            background: #fff;
            border-radius: 50%;
        }

        .robot-status {
            margin-top: 10px;
            background: rgba(8, 12, 20, 0.7);
            border: 1px solid #00f2fe;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            color: #00f2fe;
            letter-spacing: 1px;
            box-shadow: 0 0 10px rgba(0,242,254,0.3);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-18px) rotate(2deg); }
        }

        /* Widget Box for BG Changer */
        .widget-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(10, 20, 35, 0.65);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 242, 254, 0.3);
            padding: 12px;
            border-radius: 10px;
            display: flex;
            gap: 8px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        .widget-panel input {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid #00f2fe;
            color: #fff;
            padding: 6px 12px;
            border-radius: 5px;
            outline: none;
            width: 220px;
            font-size: 12px;
        }

        .widget-panel button {
            background: linear-gradient(45deg, #00f2fe, #4facfe);
            border: none;
            color: #000;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 12px;
        }

        .widget-panel button:hover {
            box-shadow: 0 0 10px #00f2fe;
        }

        /* Taskbar */
        #taskbar {
            height: 45px;
            background: rgba(6, 10, 18, 0.85);
            backdrop-filter: blur(15px);
            border-top: 1px solid rgba(0, 242, 254, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            position: fixed;
            bottom: 0;
            width: 100%;
            z-index: 100;
        }

        .taskbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .start-btn {
            width: 32px;
            height: 32px;
            background: radial-gradient(circle, #00f2fe, #0052d4);
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
            border: 1px solid #fff;
        }

        .search-bar {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(0, 242, 254, 0.3);
            border-radius: 20px;
            padding: 4px 12px;
            transition: 0.3s;
        }

        .search-bar:focus-within {
            border-color: #00f2fe;
            box-shadow: 0 0 10px rgba(0,242,254,0.3);
            background: rgba(0, 0, 0, 0.4);
        }

        .search-bar input {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            padding-left: 8px;
            width: 200px;
            font-size: 13px;
        }

        .system-tray {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 12px;
            color: #8ab4f8;
        }

        #clock {
            color: #e0f7fa;
            font-weight: 500;
            text-shadow: 0 0 5px rgba(0,242,254,0.5);
        }
    </style>
</head>
<body>

    <div id="desktop">
        
        <div class="icon-grid">
            <div class="shortcut" onclick="openLink('https://facebook.com')">
                <img src="https://cdn-icons-png.flaticon.com/512/5968/5968764.png" alt="FB">
                <span>Facebook</span>
            </div>
            <div class="shortcut" onclick="openLink('https://instagram.com')">
                <img src="https://cdn-icons-png.flaticon.com/512/2111/2111463.png" alt="IG">
                <span>Instagram</span>
            </div>
            <div class="shortcut" onclick="openLink('https://youtube.com')">
                <img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png" alt="YT">
                <span>YouTube</span>
            </div>
            <div class="shortcut" onclick="openLink('https://drive.google.com')">
                <img src="https://cdn-icons-png.flaticon.com/512/5968/5968523.png" alt="Drive">
                <span>Drive</span>
            </div>
            <div class="shortcut" onclick="openLink('https://discord.com')">
                <img src="https://cdn-icons-png.flaticon.com/512/5968/5968756.png" alt="Discord">
                <span>Discord</span>
            </div>
        </div>

        <div class="widget-panel">
            <input type="text" id="bgUrlInput" placeholder="วางลิงก์รูปภาพ Google ที่นี่...">
            <button onclick="changeBackground()">เปลี่ยนรูป</button>
        </div>

        <div class="robot-container">
            <div class="robot-avatar">
                <div class="robot-eyes">
                    <div class="eye"></div>
                    <div class="eye"></div>
                </div>
            </div>
            <div class="robot-status">AI ONLINE</div>
        </div>

    </div>

    <div id="taskbar">
        <div class="taskbar-left">
            <div class="start-btn" onclick="alert('System Core Active')">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M0 0h11v11H0zM13 0h11v11H13zM0 13h11v11H0zM13 13h11v11H13z"/></svg>
            </div>
            <div class="search-bar">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#00f2fe" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
                <input type="text" id="searchInput" placeholder="พิมพ์เพื่อค้นหา Google..." onkeypress="handleSearch(event)">
            </div>
        </div>

        <div class="system-tray">
            <span>ONLINE</span>
            <span id="clock">00:00:00</span>
        </div>
    </div>

    <script>
        // ฟังก์ชันเปลี่ยนภาพพื้นหลังด้วย URL
        function changeBackground() {
            const url = document.getElementById('bgUrlInput').value.trim();
            if (url) {
                const desktop = document.getElementById('desktop');
                desktop.style.backgroundImage = `radial-gradient(circle, rgba(16,33,62,0.4) 0%, rgba(7,11,20,0.7) 100%), url('${url}')`;
            } else {
                alert('กรุณาใส่ URL ของรูปภาพ');
            }
        }

        // ฟังก์ชันค้นหา Google
        function handleSearch(event) {
            if (event.key === 'Enter') {
                const query = document.getElementById('searchInput').value;
                if (query) {
                    window.open(`https://www.google.com/search?q=${encodeURIComponent(query)}`, '_blank');
                }
            }
        }

        // ฟังก์ชันเปิดลิงก์แอปพลิเคชัน
        function openLink(url) {
            window.open(url, '_blank');
        }

        // ฟังก์ชันอัปเดตนาฬิกาเรียลไทม์
        function updateClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('th-TH');
            document.getElementById('clock').innerText = timeString;
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
